<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Desmoslist</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background: #1A4A2F;
      color: #F0FFF4;
      font-family: 'Nunito', sans-serif;
      margin: 0;
      padding: 0;
      counter-reset: levelCounter;
    }

    header {
      background: #145C39;
      padding: 25px;
      text-align: center;
      border-bottom: 2px solid #4CFF9C;
    }

    header h1 {
      margin: 0;
      font-size: 2.4rem;
      color: #4CFF9C;
      font-weight: 700;
    }

    .discord-button {
      display: inline-block;
      margin-top: 12px;
      background: #4CFF9C;
      color: #145C39;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      font-size: 1.1rem;
    }

    .discord-button:hover {
      background: #7CFFD0;
    }

    main {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 20px 50px;
    }

    .level-block {
      background: #145C39;
      border: 2px solid #4CFF9C;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 25px;
      counter-increment: levelCounter;
    }

    .level-title::before {
      content: "#" counter(levelCounter) " — ";
      color: #B8FFD8;
      font-weight: 700;
    }

    .level-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #4CFF9C;
      margin-bottom: 6px;
    }

    .creator {
      font-size: 1.1rem;
      color: #E3FFE9;
    }

    a {
      color: #B8FFD8;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <h1>The Desmoslist</h1>

    <!-- ⭐ DISCORD BUTTON (paste your invite link below) -->
    <a class="discord-button" href="https://discord.gg/JPB42zf3N" target="_blank">
      Open Discord Server
    </a>
  </header>

  <main>

      <div class="creator">by CreatorName</div>

      <div class="level-title"><a href="heliopolisbythedesmosguy.html">[Top 1] Heliopolis 100%</a></div>

    </div>

  </main>
</body>
</html>
